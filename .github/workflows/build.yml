name: Build IR KOP APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        
    - name: Install dependencies
      run: flutter pub get

    - name: Generate Android Folder
      run: flutter create . --platforms=android
      
    - name: Setup NDK and Gradle Fixes
      run: |
        # قبول کردن مجوزهای اندروید
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        # نصب NDK مورد نیاز
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.1.8937393"
        # تغییر نسخه NDK در پروژه
        sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "25.1.8937393"/g' android/app/build.gradle.kts
        # رفع ارورهای Gradle
        echo "android.newDsl=false" >> android/gradle.properties
        echo "android.builtInKotlin=false" >> android/gradle.properties
      
    - name: Build APK
      run: flutter build apk --release
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ir-kop-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
