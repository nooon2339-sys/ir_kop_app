name: ir_kop
description: IR KOP - Advanced Secure VPN
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_v2ray_client: ^3.4.0
  clipboard: ^0.1.3
  shared_preferences: ^2.2.2
  fluttertoast: ^8.2.4
  url_launcher: ^6.2.4
  google_fonts: ^6.1.0
  lottie: ^3.1.0
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
